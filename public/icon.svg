<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E0E14" />
      <stop offset="45%" stop-color="#0E0F16" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2B36" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#B20710" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFB3B8" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#E50914" stop-opacity="0" />
    </radialGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#E50914" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="#FF2B36" stroke-width="6" stroke-opacity="0.35" />
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#centerGlow)" />

  <!-- Film Edge Markers (Cinema aesthetic) -->
  <g fill="#FFFFFF" fill-opacity="0.12">
    <rect x="52" y="70" width="16" height="26" rx="5" />
    <rect x="52" y="112" width="16" height="26" rx="5" />
    <rect x="52" y="374" width="16" height="26" rx="5" />
    <rect x="52" y="416" width="16" height="26" rx="5" />
    <rect x="444" y="70" width="16" height="26" rx="5" />
    <rect x="444" y="112" width="16" height="26" rx="5" />
    <rect x="444" y="374" width="16" height="26" rx="5" />
    <rect x="444" y="416" width="16" height="26" rx="5" />
  </g>

  <!-- Cinema 'C' Shape (Bold, clean curve) -->
  <path d="M 345 155 C 315 125 272 110 220 115 C 145 122 92 182 92 256 C 92 330 145 390 220 397 C 272 402 315 387 345 357 C 353 349 349 335 338 335 L 292 335 C 285 335 279 339 273 344 C 255 358 234 362 214 358 C 168 350 144 310 144 256 C 144 202 168 162 214 154 C 234 150 255 154 273 168 C 279 173 285 177 292 177 L 338 177 C 349 177 353 163 345 155 Z"
        fill="url(#redGrad)"
        filter="url(#glowFilter)" />

  <!-- Play Button (Forward triangle nested inside C) -->
  <path d="M 235 195 C 224 188 210 196 210 209 L 210 303 C 210 316 224 324 235 317 L 305 270 C 315 264 315 248 305 242 Z"
        fill="url(#playGrad)"
        filter="url(#glowFilter)" />
</svg>