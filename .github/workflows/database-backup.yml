name: Encrypted Supabase backup

on:
  schedule:
    - cron: "15 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify required secrets
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Missing SUPABASE_DB_URL"; exit 1; }
          test -n "$BACKUP_ENCRYPTION_PASSWORD" || { echo "Missing BACKUP_ENCRYPTION_PASSWORD"; exit 1; }

      - name: Dump and encrypt database
        id: backup
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
          PGSSLMODE: require
        run: |
          stamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          archive="supabase-${stamp}.dump.enc"
          pg_dump "$SUPABASE_DB_URL" --format=custom --compress=9 --no-owner --no-privileges \
            | openssl enc -aes-256-cbc -pbkdf2 -salt \
                -pass env:BACKUP_ENCRYPTION_PASSWORD \
                -out "$RUNNER_TEMP/$archive"
          sha256sum "$RUNNER_TEMP/$archive" > "$RUNNER_TEMP/${archive}.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.archive }}
          path: |
            ${{ runner.temp }}/${{ steps.backup.outputs.archive }}
            ${{ runner.temp }}/${{ steps.backup.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

