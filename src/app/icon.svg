<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="c_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151B" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <linearGradient id="c_accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#A8000A" />
    </linearGradient>
    <linearGradient id="c_silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#B0B5C0" />
    </linearGradient>
    <radialGradient id="c_subtle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2B36" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF2B36" stop-opacity="0" />
    </radialGradient>
    <filter id="c_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#E50914" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="28" y="28" width="456" height="456" rx="114" fill="url(#c_bg)" stroke="#262835" stroke-width="3" />
  <circle cx="256" cy="256" r="180" fill="url(#c_subtle)" />

  <!-- Minimalist Dual Arc Cinema C -->
  <path d="M 340 160 C 300 120 240 108 185 130 C 120 156 80 220 84 290 C 88 360 144 416 215 416 C 265 416 312 390 340 352 C 348 342 340 330 328 330 L 285 330 C 275 330 268 335 260 342 C 240 360 212 368 188 358 C 150 342 136 300 144 260 C 152 220 188 188 230 184 C 255 182 280 192 296 210 L 332 174 C 340 166 340 156 340 160 Z"
        fill="url(#c_accent)"
        filter="url(#c_shadow)" />

  <!-- Double Forward Chevron (Fast-forward / Cinema Stream) -->
  <path d="M 230 216 L 270 256 L 230 296 C 224 302 214 298 214 288 L 214 224 C 214 214 224 210 230 216 Z" fill="url(#c_silver)" filter="url(#c_shadow)" />
  <path d="M 276 216 L 316 256 L 276 296 C 270 302 260 298 260 288 L 260 224 C 260 214 270 210 276 216 Z" fill="#FFFFFF" filter="url(#c_shadow)" />
</svg>